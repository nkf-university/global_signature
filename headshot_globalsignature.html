<!--
=================================================================
  SETUP INSTRUCTIONS
=================================================================

  STEP 1. Host images on GitHub:
  ------------------------------
  a) Create a new public repo on github.com (e.g. "signature")
  b) Upload these two files:
       - hosted_headshot.png
       - hosted_logo.png
  c) Click each file on GitHub, click "Raw", copy the URL.
     It looks like:
       https://raw.githubusercontent.com/YOUR_USERNAME/signature/main/hosted_headshot.png

  STEP 2. Replace placeholders:
  -----------------------------
  In this file, replace:
    https://github.com/nkf-university/global_signature/blob/main/Headshot%20Email%20Signature%20Banner.png?raw=true   ->   your headshot raw URL
    https://github.com/nkf-university/global_signature/blob/main/Email%20Signature%20Banner.png?raw=true       ->   your logo raw URL

  STEP 3. Install in Gmail:
  -------------------------
  a) Open this HTML file in a browser (double-click it)
  b) Click anywhere in the rendered signature, press Cmd/Ctrl+A,
     then Cmd/Ctrl+C to copy
  c) Gmail -> Settings (gear) -> "See all settings"
  d) "General" -> "Signature" -> "Create new"
  e) Paste into the signature editor
  f) Click "Save Changes" at the bottom

  The signature editor's own background is white so the preview
  may look off — sent emails will render the dark background.
-->
